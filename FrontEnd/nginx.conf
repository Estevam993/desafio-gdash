server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Configuração SPA - sempre serve index.html para rotas não estáticas
    location / {
        try_files $uri @index;
    }

    location @index {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        return 200 /index.html;
    }

    # Assets com cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}